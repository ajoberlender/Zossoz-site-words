name: SightWords
options:
  bundleIdPrefix: com.zossoz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SightWords:
    type: application
    platform: iOS
    sources:
      - path: SightWords
        excludes:
          - Resources/Sounds
      # Copied into the app as a folder (Sounds/letter-a.wav, ...) so every recorded clip is bundled as-is.
      - path: SightWords/Resources/Sounds
        type: folder
        buildPhase: resources
    info:
      path: SightWords/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sight Words
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Lets your child read aloud so the app can listen and check the words. Audio is processed on this device."
        NSSpeechRecognitionUsageDescription: "Checks the words your child reads aloud. Recognition runs on this device."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zossoz.sightwords
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
